[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litkit"
version = "0.1.0"
description = "Quality-aware, citation-graph literature search and quote extraction toolkit (Click CLI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Lalanda Delgado" }]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "networkx>=3.2",
  "rapidfuzz>=3.6",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
litkit = "litkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litkit = ["data/*.toml", "data/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
