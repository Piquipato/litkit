<script>
(function () {
  'use strict';
  var OPEN = '<script type="application/json" ' + 'id="form-data">', CLOSE = '</' + 'script>';
  var SRC = '<!doctype html>\n' + document.documentElement.outerHTML;   // pristine copy, before rendering
  var data = JSON.parse(document.getElementById('form-data').textContent);
  if (!Array.isArray(data.responses)) data.responses = [];
  var fileName = data.meta.file.split('/').pop();
  var $ = function (id) { return document.getElementById(id); };

  // Unsaved answers survive a reload in this browser (same key as template v1, so older forms keep theirs).
  var KEY = 'hedwigg-form:' + data.meta.id + ':' + data.meta.last_updated;
  try { var saved = localStorage.getItem(KEY); if (saved) { var s = JSON.parse(saved); data.items.forEach(function (it) { var o = s[it.id]; if (o) { ['answer','done','note'].forEach(function (k) { if (k in o) it[k] = o[k]; }); } }); } } catch (e) {}

  function esc(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function md(t) {   // tiny renderer: ```blocks``` and `code`, nothing else
    return esc(t).split('```').map(function (part, i) { return i % 2 ? '<pre>' + part.replace(/^\w*\n/, '') + '</pre>' : part.replace(/`([^`]+)`/g, '<code>$1</code>'); }).join('');
  }
  function answered(it) {
    if (it.type === 'task') return !!it.done;
    if (it.type === 'multi') return (it.answer || []).length > 0;
    return it.answer != null && String(it.answer).trim() !== '';
  }
  function say(text, bad) { var m = $('msg'); m.textContent = text; m.className = 'hint' + (bad ? ' bad' : ''); }
  function nowIso() {
    var now = new Date(), off = -now.getTimezoneOffset(), p = function (n) { return String(Math.abs(n)).padStart(2, '0'); };
    return now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) + 'T' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds()) + (off >= 0 ? '+' : '-') + p(off / 60 | 0) + ':' + p(off % 60);
  }
  function persist() {
    var s = {}; data.items.forEach(function (it) { s[it.id] = { answer: it.answer, done: it.done, note: it.note }; });
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    var n = data.items.filter(answered).length;
    $('prog').style.width = (100 * n / data.items.length) + '%';
    $('count').textContent = n + ' / ' + data.items.length;
    data.items.forEach(function (it) { var el = $('item-' + it.id); if (el) el.classList.toggle('done', answered(it)); });
  }

  // ---- where are we running? Writing into the file needs Chrome or Edge in a normal tab. ----
  var embedded = (function () { try { return window.top !== window.self; } catch (e) { return true; } })() || /\b(Code|Electron)\//.test(navigator.userAgent);
  var canWrite = !!window.showOpenFilePicker && !embedded;
  if (embedded) {
    $('env').hidden = false;
    $('env').textContent = 'This page is shown inside another app (an editor preview or embedded browser), which does not let pages write files. ' +
      'Open ' + fileName + ' in Chrome or Edge to save into it: right-click the file → Open with, or drag it into a browser tab. Your answers stay in this window meanwhile.';
  } else if (!window.showOpenFilePicker) {
    $('env').hidden = false;
    $('env').textContent = 'This browser cannot write into files (Firefox and Safari can\'t). Open ' + fileName + ' in Chrome or Edge to save into it; here "Download a copy" is the fallback.';
  }

  // ---- header and tabs ----
  document.title = data.meta.title;
  $('title').textContent = data.meta.title;
  $('meta').textContent = data.meta.file + ' · ' + data.meta.produced_by_model + ' · ' + data.meta.created + ' · status ' + data.meta.status;
  $('intro').innerHTML = md(data.meta.intro || '');
  function showTab(hist) {
    $('tab-form').setAttribute('aria-selected', String(!hist)); $('tab-hist').setAttribute('aria-selected', String(hist));
    $('form').hidden = hist; $('history').hidden = !hist;
  }
  $('tab-form').onclick = function () { showTab(false); };
  $('tab-hist').onclick = function () { showTab(true); };

  // ---- the form ----
  var form = $('form');
  data.items.forEach(function (it, idx) {
    var d = document.createElement('section'); d.className = 'item'; d.id = 'item-' + it.id;
    var h = '<h2><span class="num">' + (idx + 1) + '</span><span>' + esc(it.title) + '</span>' +
      '<span class="tag">' + esc(it.type) + '</span>' + (it.required ? '<span class="tag req">required</span>' : '') + '</h2>';
    if (it.body) h += '<div class="body">' + md(it.body) + '</div>';
    var name = 'f-' + it.id;
    if (it.type === 'task') {
      h += '<label class="opt"><input type="checkbox" data-k="done"' + (it.done ? ' checked' : '') + '> Done</label>';
    } else if (it.type === 'choice' || it.type === 'multi') {
      var multi = it.type === 'multi', cur = it.answer;
      (it.options || []).forEach(function (o) {
        var on = multi ? (cur || []).indexOf(o.value) >= 0 : cur === o.value;
        h += '<label class="opt"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="' + name + '" value="' + esc(o.value) + '"' + (on ? ' checked' : '') + '> ' +
          esc(o.label) + (o.recommended ? ' <span class="rec">(recommended)</span>' : '') + (o.description ? '<span class="optdesc">' + md(o.description) + '</span>' : '') + '</label>';
      });
      if (it.allow_other && !multi) {
        var isOther = cur != null && !(it.options || []).some(function (o) { return o.value === cur; });
        h += '<label class="opt"><input type="radio" name="' + name + '" value="__other"' + (isOther ? ' checked' : '') + '> Other: <input type="text" data-k="other" value="' + (isOther ? esc(cur) : '') + '"></label>';
      }
    } else {
      h += '<textarea data-k="answer">' + esc(it.answer || '') + '</textarea>';
    }
    if (it.type !== 'text') h += '<div class="row"><input type="text" data-k="note" placeholder="Note (optional)" value="' + esc(it.note || '') + '"></div>';
    d.innerHTML = h;
    d.addEventListener('input', function (ev) {
      var t = ev.target, k = t.getAttribute('data-k');
      if (k === 'done') it.done = t.checked;
      else if (k === 'note') it.note = t.value;
      else if (k === 'answer') it.answer = t.value;
      else if (k === 'other') { it.answer = t.value; var r = d.querySelector('input[value="__other"]'); if (r) r.checked = true; }
      else if (t.name === name && it.type === 'multi') it.answer = Array.prototype.filter.call(d.querySelectorAll('input[name="' + name + '"]'), function (x) { return x.checked; }).map(function (x) { return x.value; });
      else if (t.name === name) it.answer = t.value === '__other' ? (d.querySelector('[data-k="other"]').value || '') : t.value;
      persist();
    });
    form.appendChild(d);
  });
  persist();

  // ---- previous responses ----
  function show(it, a) {
    if (!a) return '—';
    var v;
    if (it.type === 'task') v = a.done ? 'done' : 'not done';
    else if (it.type === 'multi') v = (a.answer || []).map(function (x) { var o = (it.options || []).filter(function (o) { return o.value === x; })[0]; return o ? o.label : x; }).join(', ') || '—';
    else if (it.type === 'choice') { var o = (it.options || []).filter(function (o) { return o.value === a.answer; })[0]; v = o ? o.label : (a.answer == null || a.answer === '' ? '—' : a.answer); }
    else v = a.answer == null || String(a.answer).trim() === '' ? '—' : a.answer;
    return v + (a.note ? ' (note: ' + a.note + ')' : '');
  }
  function renderHistory() {
    var rs = data.responses, box = $('history');
    $('tab-hist').textContent = 'Previous responses (' + rs.length + ')';
    if (!rs.length) { box.innerHTML = '<p class="hint">No response saved yet. Each "Save into this file" adds one here, and nothing is ever overwritten.</p>'; return; }
    var html = '';
    for (var i = rs.length - 1; i >= 0; i--) {
      var r = rs[i], prev = i > 0 ? rs[i - 1].answers || {} : {}, cur = r.answers || {}, changes = '', all = '';
      data.items.forEach(function (it) {
        var now = show(it, cur[it.id]), was = show(it, prev[it.id]);
        all += '<li><b>' + esc(it.title) + ':</b> ' + esc(now) + '</li>';
        if (now !== was) changes += '<li><b>' + esc(it.title) + ':</b> ' + (i > 0 ? '<span class="old">' + esc(was) + '</span> → ' : '') + esc(now) + '</li>';
      });
      html += '<section class="item resp"><h2><span class="num">#' + (i + 1) + '</span><span>' + esc(r.saved_at) + '</span><span class="tag">' + esc(r.status || '') + '</span></h2>' +
        (changes ? '<div class="hint">' + (i > 0 ? 'Changed since #' + i : 'Answers') + '</div><ul>' + changes + '</ul>' : '<div class="hint">No change since #' + i + '.</div>') +
        '<details><summary>All answers in #' + (i + 1) + '</summary><ul>' + all + '</ul></details></section>';
    }
    box.innerHTML = html;
  }
  renderHistory();

  // ---- saving: everything goes into this same file ----
  function snapshot(iso) {
    var a = {};
    data.items.forEach(function (it) { var o = {}; ['answer','done','note'].forEach(function (k) { if (it[k] !== undefined) o[k] = it[k]; }); a[it.id] = o; });
    return { saved_at: iso, status: data.meta.status, answers: a };
  }
  function formOf(html) {   // the form-data JSON of an HTML text, or null
    try { var el = new DOMParser().parseFromString(html, 'text/html').getElementById('form-data'); return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; }
  }
  function withJson(html, obj) {
    var i = html.indexOf(OPEN), j = html.indexOf(CLOSE, i);
    if (i < 0 || j < 0) throw new Error('the form-data block is missing');
    return html.slice(0, i + OPEN.length) + '\n' + JSON.stringify(obj, null, 2).replace(/<\//g, '<\\/') + '\n' + html.slice(j);
  }
  // Builds the new file. base = the file's current text (so a newer template or responses saved from another
  // tab are kept) or this page's own source. Returns { html, obj }.
  function build(baseHtml, onDisk) {
    var iso = nowIso();
    var req = data.items.filter(function (it) { return it.required; });
    if (data.meta.status === 'open' && req.every(answered)) data.meta.status = 'answered';
    data.meta.answered_at = iso;
    var obj = JSON.parse(JSON.stringify(data));
    var past = onDisk && Array.isArray(onDisk.responses) && onDisk.responses.length >= data.responses.length ? onDisk.responses : data.responses;
    if (onDisk && onDisk.meta && (onDisk.meta.status === 'processed' || onDisk.meta.status === 'superseded')) obj.meta.status = onDisk.meta.status;
    obj.responses = past.concat([snapshot(iso)]);
    return { html: withJson(baseHtml, obj), obj: obj };
  }

  var DB = 'hedwigg-forms', STORE = 'handles';
  function idb() { return new Promise(function (ok, no) { var r = indexedDB.open(DB, 1); r.onupgradeneeded = function () { r.result.createObjectStore(STORE); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { no(r.error); }; }); }
  function loadHandle() { return idb().then(function (db) { return new Promise(function (ok) { var q = db.transaction(STORE).objectStore(STORE).get(data.meta.id); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ok(null); }; }); }).catch(function () { return null; }); }
  function keepHandle(h) { return idb().then(function (db) { db.transaction(STORE, 'readwrite').objectStore(STORE).put(h, data.meta.id); }).catch(function () {}); }
  function forgetHandle() { return idb().then(function (db) { db.transaction(STORE, 'readwrite').objectStore(STORE).delete(data.meta.id); }).catch(function () {}); }

  var handle = null;
  async function pickFile() {
    say('Choose this form\'s own file, ' + fileName + ' (in brain/actions/). The page asks only once.');
    var hs = await window.showOpenFilePicker({ id: 'hedwigg-actions', multiple: false, types: [{ description: 'Action form', accept: { 'text/html': ['.html'] } }] });
    return hs[0];
  }
  async function writeIntoFile() {
    if (!handle) handle = await loadHandle();
    if (!handle) handle = await pickFile();
    var perm = await handle.queryPermission({ mode: 'readwrite' });
    // requestPermission needs a fresh click; if Chrome refuses it here, createWritable below asks instead.
    if (perm !== 'granted') { try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) { perm = 'prompt'; } }
    if (perm === 'denied') { var e = new Error('permission'); e.name = 'NotAllowedError'; throw e; }
    var text = await (await handle.getFile()).text(), onDisk = formOf(text);
    if (!onDisk || !onDisk.meta || onDisk.meta.id !== data.meta.id) {
      var picked = handle.name; handle = null; await forgetHandle();
      throw new Error(picked + ' is not this form (' + fileName + '). Nothing was written; press Save again and pick ' + fileName + '.');
    }
    var out = build(text, onDisk);
    var w = await handle.createWritable();
    await w.write(out.html); await w.close();
    await keepHandle(handle);
    data.responses = out.obj.responses; data.meta.status = out.obj.meta.status;
    renderHistory();
    $('meta').textContent = data.meta.file + ' · ' + data.meta.produced_by_model + ' · ' + data.meta.created + ' · status ' + data.meta.status;
    say('Saved into ' + handle.name + ' at ' + out.obj.meta.answered_at.slice(11, 16) + ' (response #' + data.responses.length + ', status ' + data.meta.status + '). Tell the model in chat.');
  }
  function download() {
    var out = build(SRC, null);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.html], { type: 'text/html' })); a.download = fileName; a.click();
    data.responses = out.obj.responses; renderHistory();
    say('Downloaded ' + fileName + ' (response #' + data.responses.length + '). Move it over the original in brain/actions/.');
  }
  $('save').onclick = async function () {
    if (!canWrite) { say(embedded ? 'Saving into the file does not work inside this app. Open ' + fileName + ' in Chrome or Edge, or use "Download a copy".' : 'This browser cannot write files. Use Chrome or Edge, or "Download a copy".', true); return; }
    try { await writeIntoFile(); }
    catch (e) {
      if (e.name === 'AbortError') { say('Not saved (no file chosen).'); return; }
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { handle = null; await forgetHandle(); say('The browser did not allow writing to the file (permission refused, or the page runs where file writes are blocked). Open ' + fileName + ' directly in Chrome or Edge and press Save again, or use "Download a copy". Your answers are kept.', true); return; }
      say('Save failed: ' + e.message, true);
    }
  };
  $('download').onclick = download;
  $('copy').onclick = function () {
    var out = data.items.map(function (it, i) { return (i + 1) + '. ' + it.title + ': ' + (it.type === 'task' ? (it.done ? 'done' : 'not done') : JSON.stringify(it.answer)) + (it.note ? ' (note: ' + it.note + ')' : ''); }).join('\n');
    navigator.clipboard.writeText(out).then(function () { say('Answers copied; paste them in the chat.'); });
  };
})();
</script>
</body>
</html>
